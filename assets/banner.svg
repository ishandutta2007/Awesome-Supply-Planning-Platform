<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A2BE2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B0082;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font: bold 40px sans-serif; fill: white; }
      .subtitle { font: 20px sans-serif; fill: #ddd; }
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      .anim { animation: pulse 3s infinite; transform-origin: center; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" rx="15"/>
  <g class="anim">
    <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" class="title">Awesome Supply Planning Platform</text>
    <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle" class="subtitle">🚀 Top Tools, SaaS, and Open-Source Projects</text>
  </g>
</svg>
